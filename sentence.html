<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dictation 1 · Colourful toys（句子特訓）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#3a2a3a;--muted:#7a6a7a;--pink:#ff8fab;--pink-d:#ff6b8a;--blue:#7ec8e3;--blue-d:#5bb0d0;--yellow:#ffe566;--green:#8fd9a8;--purple:#c9a0dc;--shadow:0 8px 24px rgba(90,60,80,.12)}
html,body{min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:linear-gradient(165deg,#fff8f0 0%,#ffe8f0 45%,#e8f4ff 100%);color:var(--ink);display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;padding:16px 16px 28px;max-width:560px;margin:0 auto;width:100%}.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.btn-back,.btn-speak{border:none;background:#fff;border-radius:999px;padding:10px 16px;font-size:1rem;font-weight:700;box-shadow:var(--shadow);color:var(--ink);cursor:pointer;min-height:44px}
.btn-speak{background:var(--blue);color:#fff}.btn-speak.slow{background:var(--purple);color:#fff}
.badge{background:var(--yellow);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:800}
.stars{font-size:1.35rem;font-weight:800}
h1{font-size:1.45rem;line-height:1.3;margin:4px 0 6px}
.sub{color:var(--muted);font-size:.92rem;line-height:1.4;margin-bottom:16px}
.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode-btn{border:none;border-radius:18px;padding:18px 12px;min-height:110px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:1.05rem;color:var(--ink);box-shadow:var(--shadow);text-align:center}
.mode-btn .emoji{font-size:2rem}.mode-btn.wide{grid-column:1/-1;min-height:84px;flex-direction:row;gap:12px}
.m1{background:linear-gradient(145deg,#ffe8f0,#ffd0e0)}.m2{background:linear-gradient(145deg,#e8f8ff,#cceeff)}
.m3{background:linear-gradient(145deg,#fff6d6,#ffe8a0)}.m4{background:linear-gradient(145deg,#efe6ff,#ddd0ff)}
.m5{background:linear-gradient(145deg,#e6ffe8,#c8f5d0)}.m6{background:linear-gradient(145deg,#ffe8d6,#ffd0b0)}
.prompt{text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:10px}
.pic{font-size:4rem;text-align:center;margin:8px 0 14px}
.sentence{font-size:1.35rem;font-weight:700;text-align:center;line-height:1.5;margin:14px 0}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--pink);color:var(--pink);padding:0 4px}
.choices{display:grid;grid-template-columns:1fr;gap:10px}.choices.cols2{grid-template-columns:1fr 1fr}
.choice{border:3px solid transparent;background:#fff;border-radius:16px;padding:16px 14px;font-size:1.25rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow);min-height:58px;text-align:center;color:var(--ink)}
.choice.correct{border-color:#4caf70;background:#e8f8ee}.choice.wrong{border-color:#e57373;background:#ffeaea}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.slot,.tile{min-width:48px;height:50px;padding:0 12px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;cursor:pointer}
.slot{background:#f3eef5;border:2px dashed #cbb8d0;color:var(--muted)}.slot.filled{background:#fff;border:2px solid var(--pink);color:var(--ink)}
.tile{background:linear-gradient(145deg,var(--pink),var(--pink-d));color:#fff;border:none;box-shadow:0 4px 12px rgba(255,107,138,.35)}.tile.used{opacity:.35;pointer-events:none}
.type-input{display:block;width:100%;margin:14px 0 6px;padding:16px 14px;font-size:1.35rem;font-weight:700;text-align:center;border:3px solid #e8d8e8;border-radius:16px;background:#fffafc;color:var(--ink);outline:none}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn-primary,.btn-soft{border:none;border-radius:999px;padding:14px 22px;font-size:1.1rem;font-weight:800;cursor:pointer;min-height:48px;box-shadow:var(--shadow)}
.btn-primary{background:linear-gradient(145deg,var(--pink),var(--pink-d));color:#fff}.btn-soft{background:#fff;color:var(--ink)}
.progress{height:10px;background:#f0e6ef;border-radius:999px;overflow:hidden;margin:8px 0 14px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--blue));transition:width .25s}
.feedback{text-align:center;font-size:1.2rem;font-weight:800;min-height:1.6em;margin:8px 0}.feedback.good{color:#2e8b57}.feedback.try{color:#c45c26}
.tip{background:#fff6e8;border-radius:14px;padding:12px 14px;font-size:.95rem;color:#6a5040;margin-top:10px;line-height:1.45}
.hidden{display:none!important}
</style>
</head>
<body>
<section id="home" class="screen active">
 <div class="topbar"><span class="badge">Dictation 1 · 16 Oct · 句子特訓</span><span class="stars" id="homeStars">⭐ 0</span></div>
 <h1>🌈 Colourful toys<br>默書小遊戲（自然真人發音）</h1>
 <p class="sub">佛教榮茵學校 · P.1 · 1B Chapter 1<br>原版排版 · 針對 3 句句子全方位特訓。</p>
 <div class="mode-grid">
  <button class="mode-btn m3" data-mode="order"><span class="emoji">🚂</span>句子排排坐</button>
  <button class="mode-btn m1" data-mode="cloze"><span class="emoji">✏️</span>句子全字填空</button>
  <button class="mode-btn m2" data-mode="spell"><span class="emoji">🔤</span>句子拆字拼詞</button>
  <button class="mode-btn m4" data-mode="type"><span class="emoji">⌨️</span>句子真默書</button>
  <button class="mode-btn m5 wide" data-mode="quick"><span class="emoji">🎡</span>詞彙 · 高頻字 · Phonics 快溫</button>
 </div>
 <div class="tip">🔊 已升級自然真人發音：優先播放真人字典發音，並保持自然人聲語速（0.82）；撳「🐢 逐字慢讀」會喺每個字之間停頓 1.1 秒，唔會變機械人聲！</div>
</section>
<section id="play" class="screen">
 <div class="topbar"><button class="btn-back" id="btnHome">← 主頁</button><span id="modeTitle" style="font-weight:800"></span><span class="stars" id="playStars">⭐ 0</span></div>
 <div class="progress"><i id="bar"></i></div>
 <div class="card">
  <div class="prompt" id="prompt"></div>
  <div class="pic hidden" id="pic"></div>
  <div class="sentence hidden" id="sbox"></div>
  <div class="letters hidden" id="slots"></div>
  <div class="letters hidden" id="tiles"></div>
  <input type="text" id="inp" class="type-input hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="打成句英文…">
  <div class="choices" id="choices"></div>
  <div class="feedback" id="fb"></div>
  <div class="actions" id="acts"></div>
  <div class="tip hidden" id="tip"></div>
 </div>
</section>
<script>
const SENTS=[
 {full:'It is yellow and blue.',tokens:['It','is','yellow','and','blue','.'],extra:['are','?'],emoji:'💛💙',zh:'它是黃色和藍色的。'},
 {full:'What colour are the teddy bears?',tokens:['What','colour','are','the','teddy','bears','?'],extra:['is','.'],emoji:'🧸🧸❓',zh:'玩具熊是什麼顏色的？'},
 {full:'My cars are purple and white.',tokens:['My','cars','are','purple','and','white','.'],extra:['is','car'],emoji:'🚗💜🤍',zh:'我的車是紫色和白色的。'}
];
const CLOZES=[
 {full:'It is yellow and blue.',c:'_____ is yellow and blue.',a:'It',o:['It','This','My','She'],t:'句首「它是」用大楷 It'},
 {full:'It is yellow and blue.',c:'It is _____ and blue.',a:'yellow',o:['yellow','purple','white','blue'],t:'黃色 yellow (y-e-l-l-o-w)'},
 {full:'It is yellow and blue.',c:'It is yellow _____ blue.',a:'and',o:['and','in','on','are'],t:'連接兩個顏色用 and'},
 {full:'It is yellow and blue.',c:'It is yellow and _____.',a:'blue',o:['blue','ball','bears','old'],t:'藍色 blue (b-l-u-e)'},
 {full:'What colour are the teddy bears?',c:'_____ colour are the teddy bears?',a:'What',o:['What','This','It','My'],t:'疑問句用大楷 What 開頭，尾加 ?'},
 {full:'What colour are the teddy bears?',c:'What _____ are the teddy bears?',a:'colour',o:['colour','cars','toys','blue'],t:'顏色 colour (c-o-l-o-u-r)'},
 {full:'What colour are the teddy bears?',c:'What colour _____ the teddy bears?',a:'are',o:['are','is','in','on'],t:'teddy bears 係眾數，配 are'},
 {full:'What colour are the teddy bears?',c:'What colour are _____ teddy bears?',a:'the',o:['the','a','this','my'],t:'記住 are 後面有 the'},
 {full:'What colour are the teddy bears?',c:'What colour are the _____ bears?',a:'teddy',o:['teddy','train','teeth','turtle'],t:'玩具熊 teddy (t-e-d-d-y)'},
 {full:'What colour are the teddy bears?',c:'What colour are the teddy _____?',a:'bears',o:['bears','bear','balls','cars'],t:'眾數要加 s：bears'},
 {full:'My cars are purple and white.',c:'_____ cars are purple and white.',a:'My',o:['My','It','She','This'],t:'「我的」句首大楷 My'},
 {full:'My cars are purple and white.',c:'My _____ are purple and white.',a:'cars',o:['cars','car','planes','dolls'],t:'眾數車要加 s：cars'},
 {full:'My cars are purple and white.',c:'My cars _____ purple and white.',a:'are',o:['are','is','in','and'],t:'cars 係眾數，配 are'},
 {full:'My cars are purple and white.',c:'My cars are _____ and white.',a:'purple',o:['purple','yellow','blue','old'],t:'紫色 purple (p-u-r-p-l-e)'},
 {full:'My cars are purple and white.',c:'My cars are purple and _____.',a:'white',o:['white','what','yellow','six'],t:'白色 white (w-h-i-t-e)'}
];
const SWORDS=[
 {s:'It is yellow and blue.',w:'yellow',c:'It is _____ and blue.',h:'y-e-l-l-o-w'},
 {s:'It is yellow and blue.',w:'blue',c:'It is yellow and _____.',h:'b-l-u-e'},
 {s:'What colour are the teddy bears?',w:'What',c:'_____ colour are the teddy bears?',h:'W-h-a-t'},
 {s:'What colour are the teddy bears?',w:'colour',c:'What _____ are the teddy bears?',h:'c-o-l-o-u-r'},
 {s:'What colour are the teddy bears?',w:'teddy',c:'What colour are the _____ bears?',h:'t-e-d-d-y'},
 {s:'What colour are the teddy bears?',w:'bears',c:'What colour are the teddy _____?',h:'b-e-a-r-s'},
 {s:'My cars are purple and white.',w:'cars',c:'My _____ are purple and white.',h:'c-a-r-s'},
 {s:'My cars are purple and white.',w:'purple',c:'My cars are _____ and white.',h:'p-u-r-p-l-e'},
 {s:'My cars are purple and white.',w:'white',c:'My cars are purple and _____.',h:'w-h-i-t-e'}
];
const QUICK=[
 {q:'聽音揀玩具：',s:'a doll',a:'🪆 a doll',o:['🪆 a doll','🤖 a robot','🚗 a car','⚽ a ball']},
 {q:'聽音揀玩具：',s:'a robot',a:'🤖 a robot',o:['🤖 a robot','🚂 a train','✈️ a plane','🪆 a doll']},
 {q:'聽音揀玩具：',s:'a train',a:'🚂 a train',o:['🚂 a train','🚗 a car','✈️ a plane','⚽ a ball']},
 {q:'聽音揀玩具：',s:'a plane',a:'✈️ a plane',o:['✈️ a plane','🤖 a robot','🚂 a train','🚗 a car']},
 {q:'聽音揀高頻字：',s:'she',a:'she',o:['she','six','this','in']},
 {q:'聽音揀高頻字：',s:'this',a:'this',o:['this','old','on','she']},
 {q:'Phonics s 音：',s:'sun',a:'☀️ sun',o:['☀️ sun','🍎 apple','🐢 turtle','🪓 axe']},
 {q:'Phonics a 音：',s:'axe',a:'🪓 axe',o:['🪓 axe','🏖️ sand','🦷 teeth','☀️ sun']},
 {q:'Phonics t 音：',s:'turtle',a:'🐢 turtle',o:['🐢 turtle','🍎 apple','☀️ sun','🏖️ sand']}
];
const $=id=>document.getElementById(id);
let stars=0,q=[],idx=0,tmr=null,curAu=null;
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function pickV(){
 try{
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const en=vs.filter(v=>/^en/i.test(v.lang)&&!/Fred|Albert|Bad|Bahh|Bells|Boing|Bubbles|Cellos|Good|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Kathy|Ralph/i.test(v.name));
  const p=['Natural','Premium','Enhanced','Siri','Samantha','Ava','Allison','Karen','Daniel','Moira'];
  for(const k of p){const h=en.find(v=>v.name.includes(k));if(h)return h;}
  return en[0]||null;
 }catch(e){return null;}
}
function playChunk(txt,done){
 const c=String(txt).replace(/[?.!]/g,'').trim();
 if(!c){if(done)done();return;}
 let fin=false;const ok=()=>{if(fin)return;fin=true;if(done)done();};
 try{
  const au=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(c)+'&type=1');
  curAu=au;au.playbackRate=0.88;let st=false;
  const tid=setTimeout(()=>{if(!st){try{au.pause();}catch(e){}fbSpk(c,ok);}},850);
  au.onplaying=()=>{st=true;clearTimeout(tid);};
  au.onended=()=>{clearTimeout(tid);ok();};
  au.onerror=()=>{clearTimeout(tid);fbSpk(c,ok);};
  const p=au.play();if(p&&p.catch)p.catch(()=>{clearTimeout(tid);fbSpk(c,ok);});
 }catch(e){fbSpk(c,ok);}
}
function fbSpk(c,ok){
 try{
  const u=new SpeechSynthesisUtterance(c),v=pickV();
  if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-GB';
  u.rate=0.82;u.pitch=1.02;u.onend=ok;u.onerror=ok;
  setTimeout(ok,Math.max(1100,c.length*150));
  speechSynthesis.speak(u);
 }catch(e){ok();}
}
function speak(txt,slow){
 if(tmr){clearTimeout(tmr);tmr=null;}
 try{if(curAu){curAu.pause();curAu=null;}}catch(e){}
 try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
 const clean=String(txt).replace(/[.?!]/g,' ').trim();
 if(!clean)return;
 if(!slow){playChunk(clean,null);return;}
 const ws=clean.split(/\s+/).filter(Boolean);let i=0;
 function nxt(){if(i>=ws.length)return;playChunk(ws[i++],()=>{if(i<ws.length)tmr=setTimeout(nxt,1100);});}
 nxt();
}
function addSpk(txt){
 const b1=document.createElement('button');b1.className='btn-speak';b1.textContent='🔊 自然讀';b1.onclick=()=>speak(txt,false);$('acts').appendChild(b1);
 const b2=document.createElement('button');b2.className='btn-speak slow';b2.textContent='🐢 逐字慢讀';b2.onclick=()=>speak(txt,true);$('acts').appendChild(b2);
 setTimeout(()=>speak(txt,false),250);
}
function win(){
 stars+=2;$('homeStars').textContent='⭐ '+stars;$('playStars').textContent='⭐ '+stars;
 $('fb').textContent='⭐ 好叻呀！';$('fb').className='feedback good';
 setTimeout(()=>{idx++;render();},900);
}
function fail(m){$('fb').textContent=m||'再試吓～';$('fb').className='feedback try';}
function start(m){
 idx=0;
 if(m==='order')q=SENTS.concat(SENTS).map(x=>({t:'order',d:x}));
 else if(m==='cloze')q=shuf(CLOZES.map(x=>({t:'cloze',d:x})));
 else if(m==='spell')q=SWORDS.map(x=>({t:'spell',d:x}));
 else if(m==='type')q=SENTS.concat(SENTS).map(x=>({t:'type',d:x}));
 else q=shuf(QUICK.map(x=>({t:'quick',d:x})));
 $('home').classList.remove('active');$('play').classList.add('active');render();
}
function render(){
 if(idx>=q.length){$('play').classList.remove('active');$('home').classList.add('active');return;}
 $('bar').style.width=Math.round((idx/q.length)*100)+'%';
 ['pic','sbox','slots','tiles','inp','tip'].forEach(k=>$(k).classList.add('hidden'));
 $('choices').innerHTML='';$('acts').innerHTML='';$('fb').textContent='';
 const cur=q[idx],d=cur.d;
 if(cur.t==='order'){
  $('prompt').textContent='聽句子，順序撳字卡排好成句';
  $('pic').classList.remove('hidden');$('pic').textContent=d.emoji;
  $('sbox').classList.remove('hidden');$('sbox').innerHTML=d.zh;
  const built=Array(d.tokens.length).fill(null);
  $('slots').classList.remove('hidden');$('tiles').classList.remove('hidden');
  function ref(){
   $('slots').innerHTML='';
   d.tokens.forEach((_,i)=>{
    const s=document.createElement('div');s.className='slot'+(built[i]?' filled':'');
    s.textContent=built[i]?built[i].w:(i+1);
    s.onclick=()=>{if(built[i]){built[i].b.classList.remove('used');built[i]=null;ref();}};
    $('slots').appendChild(s);
   });
  }
  $('tiles').innerHTML='';
  shuf(d.tokens.concat(d.extra)).forEach(w=>{
   const b=document.createElement('button');b.className='tile';b.textContent=w;
   b.onclick=()=>{
    const e=built.findIndex(x=>!x);if(e===-1)return;
    if(w!=='.'&&w!=='?')speak(w,false);
    built[e]={w,b};b.classList.add('used');ref();
   };
   $('tiles').appendChild(b);
  });
  ref();
  const ck=document.createElement('button');ck.className='btn-primary';ck.textContent='檢查 ✓';
  ck.onclick=()=>{
   if(built.some(x=>!x))return fail('仲有空位未排呀～');
   if(built.every((x,i)=>x.w===d.tokens[i])){$('sbox').innerHTML=d.full;win();}
   else fail('順序未啱～撳格仔可拎返出嚟！');
  };
  $('acts').appendChild(ck);addSpk(d.full);
 }else if(cur.t==='cloze'){
  $('prompt').textContent='揀啱個字填入句子';
  $('sbox').classList.remove('hidden');$('sbox').innerHTML=d.c.replace('_____','<span class="blank">？</span>');
  shuf(d.o).forEach(c=>{
   const b=document.createElement('button');b.className='choice';b.textContent=c;
   b.onclick=()=>{if(c===d.a){b.classList.add('correct');$('sbox').innerHTML=d.full;win();}else{b.classList.add('wrong');fail();}};
   $('choices').appendChild(b);
  });
  $('tip').classList.remove('hidden');$('tip').textContent='💡 '+d.t;addSpk(d.full);
 }else if(cur.t==='spell'){
  $('prompt').textContent='聽句子，排字母串出空格個字';
  $('sbox').classList.remove('hidden');$('sbox').innerHTML=d.c.replace('_____','<span class="blank">？</span>');
  const built=Array(d.w.length).fill(null);
  $('slots').classList.remove('hidden');$('tiles').classList.remove('hidden');
  function ref(){
   $('slots').innerHTML='';
   d.w.split('').forEach((_,i)=>{
    const s=document.createElement('div');s.className='slot'+(built[i]?' filled':'');
    s.textContent=built[i]?built[i].ch:'';
    s.onclick=()=>{if(built[i]){built[i].b.classList.remove('used');built[i]=null;ref();}};
    $('slots').appendChild(s);
   });
  }
  $('tiles').innerHTML='';
  shuf(d.w.split('')).forEach(ch=>{
   const b=document.createElement('button');b.className='tile';b.textContent=ch;
   b.onclick=()=>{const e=built.findIndex(x=>!x);if(e===-1)return;built[e]={ch,b};b.classList.add('used');ref();};
   $('tiles').appendChild(b);
  });
  ref();
  const ck=document.createElement('button');ck.className='btn-primary';ck.textContent='檢查 ✓';
  ck.onclick=()=>{if(built.map(x=>x?x.ch:'').join('')===d.w){$('sbox').innerHTML=d.s;win();}else fail('差少少～睇提示再排！');};
  $('acts').appendChild(ck);$('tip').classList.remove('hidden');$('tip').textContent='💡 提示：'+d.h;addSpk(d.s);
 }else if(cur.t==='type'){
  $('prompt').textContent='聽完自己打成句英文（可撳「逐字慢讀」）';
  $('sbox').classList.remove('hidden');$('sbox').innerHTML=d.zh;
  $('inp').classList.remove('hidden');$('inp').value='';
  const pk=document.createElement('button');pk.className='btn-soft';pk.textContent='👀 偷睇一秒';
  pk.onclick=()=>{$('sbox').innerHTML=d.full;setTimeout(()=>$('sbox').innerHTML=d.zh,1400);};
  const ck=document.createElement('button');ck.className='btn-primary';ck.textContent='檢查 ✓';
  ck.onclick=()=>{
   const g=$('inp').value.trim().replace(/[.?!]+$/,'').toLowerCase();
   const a=d.full.replace(/[.?!]+$/,'').toLowerCase();
   if(g===a){$('sbox').innerHTML=d.full;win();}else fail('再聽多次「逐字慢讀」試吓！');
  };
  $('acts').appendChild(pk);$('acts').appendChild(ck);addSpk(d.full);
 }else{
  $('prompt').textContent=d.q;
  shuf(d.o).forEach(c=>{
   const b=document.createElement('button');b.className='choice';b.textContent=c;
   b.onclick=()=>{if(c===d.a){b.classList.add('correct');win();}else{b.classList.add('wrong');fail();}};
   $('choices').appendChild(b);
  });
  addSpk(d.s);
 }
}
document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>start(b.dataset.mode));
$('btnHome').onclick=()=>{$('play').classList.remove('active');$('home').classList.add('active');};
</script>
</body>
